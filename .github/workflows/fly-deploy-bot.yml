name: Deploy Bot 24/7 to Fly.io (удаленно, без ПК)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bot_autonomous_v6.py'
      - 'ads_manager.py'
      - 'feedback_system.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'fly.toml'
  workflow_dispatch:

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy bot to Fly.io (24/7)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Если FLY_API_TOKEN не указан — пропускаем, бот будет на Render.com
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN не указан — пропускаем Fly.io деплой. Используй Render.com (автоматом) или добавь токен."
            echo "Как получить FLY_API_TOKEN:"
            echo "1. https://fly.io → Sign Up → Dashboard → Tokens → Create Token"
            echo "2. Скопируй и добавь в GitHub Secrets FLY_API_TOKEN"
            exit 0
          fi
          # Деплой
          flyctl deploy --remote-only --ha=false
          flyctl status
          flyctl logs --no-tail -n 20 || true

      - name: Notify admin
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$ADMIN_ID" ]; then
            curl -s -X POST https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage -d chat_id=${ADMIN_ID} -d text="🚀 Бот задеплоен на Fly.io 24/7 (или Render). Проверь fly logs / Render logs. Сайт: https://${{ github.repository_owner }}.github.io/tool-farm-max/ — /stats/ /earnings/" -d parse_mode=HTML || true
          fi
