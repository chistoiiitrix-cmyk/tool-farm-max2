name: Daily Farm Expansion
on:
  schedule:
    - cron: '0 9 * * *' # каждый день в 9 утра UTC
  workflow_dispatch: # можно запустить вручную

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build site
        run: |
          python build.py
          python auto-traffic-bot.py
      - name: Commit new pages (autonomous growth)
        run: |
          git config --global user.name "farm-bot"
          git config --global user.email "bot@toolfarm.one"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: daily expansion + traffic log"
          git push
